[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-news-detection"
version = "0.1.0"
description = "Fake news detection with BERT, RoBERTa and DeBERTa on Fake & Real News"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    "accelerate>=0.28",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "sentencepiece",   # needed by DeBERTa-v3 tokenizer
    "tiktoken",        # tokenizer conversion fallback for DeBERTa-v3
    "protobuf",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm",
]

[project.optional-dependencies]
notebook = [
    "jupyter",
    "ipykernel",
]
dev = [
    "ruff",
    "pytest",
]
demo = [
    "streamlit>=1.30",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]